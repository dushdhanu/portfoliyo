<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Dushmanthi Dhananjana | Portfolio</title>
    <script>
      // Single Page Apps for GitHub Pages redirection script
      var path = window.location.pathname;
      var repo = '/portfoliyo/';
      if (path.indexOf(repo) === 0) {
        var subpath = path.slice(repo.length);
        window.location.replace(repo + '#' + subpath);
      } else {
        window.location.replace(repo);
      }
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/portfoliyo/">portfolio</a>...</p>
  </body>
</html>
